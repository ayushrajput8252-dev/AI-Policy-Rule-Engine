<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiring Automation — ATS Resume Screening</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-border: #334155;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #38bdf8;
    --good: #34d399;
    --mid: #fbbf24;
    --bad: #f87171;
    --error-bg: #451a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.5rem 4rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .subtitle { color: var(--text-dim); margin-top: 0; margin-bottom: 1.5rem; font-size: 0.9rem; }
  form {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 1.25rem;
    display: grid;
    gap: 0.9rem;
  }
  label { font-size: 0.85rem; color: var(--text-dim); display: block; margin-bottom: 0.35rem; }
  textarea, input[type="file"] {
    width: 100%;
    background: #0b1220;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--text);
    padding: 0.6rem;
    font-family: inherit;
    font-size: 0.9rem;
  }
  textarea { min-height: 160px; resize: vertical; }
  .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  button {
    background: var(--accent);
    color: #0b1220;
    border: none;
    border-radius: 6px;
    padding: 0.65rem 1.4rem;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { margin: 1rem 0; color: var(--text-dim); font-size: 0.9rem; min-height: 1.2em; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.55rem 0.6rem; border-bottom: 1px solid var(--panel-border); font-size: 0.88rem; }
  th { color: var(--text-dim); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tr.candidate-error td { color: var(--bad); background: var(--error-bg); }
  .score { font-weight: 700; }
  .score-good { color: var(--good); }
  .score-mid { color: var(--mid); }
  .score-bad { color: var(--bad); }
  button.link-btn {
    background: transparent;
    color: var(--accent);
    padding: 0.2rem 0.5rem;
    font-weight: 500;
    font-size: 0.82rem;
  }
  tr.details-row td {
    background: #0b1220;
    font-size: 0.85rem;
    color: var(--text-dim);
    padding: 0.9rem 1rem;
  }
  tr.details-row strong { color: var(--text); }
  tr.details-row div { margin-bottom: 0.4rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ATS Resume Screening</h1>
  <p class="subtitle">Paste a job description, upload one or more resumes (PDF/DOCX), and get a ranked, fully explainable shortlist — processed in parallel.</p>

  <form id="batchForm">
    <div>
      <label for="jobDescription">Job description</label>
      <textarea id="jobDescription" required placeholder="Paste the job description here..."></textarea>
    </div>
    <div>
      <label for="resumeFiles">Resumes (PDF or DOCX, up to 25 files)</label>
      <input type="file" id="resumeFiles" multiple accept=".pdf,.docx" required>
    </div>
    <div class="row">
      <button type="submit">Score Resumes</button>
    </div>
  </form>

  <div id="status"></div>

  <table id="resultsTable" hidden>
    <thead>
      <tr>
        <th>Rank</th>
        <th>File</th>
        <th>Final</th>
        <th>Keyword</th>
        <th>Semantic</th>
        <th>Formatting</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>
</div>

<script>
  const form = document.getElementById('batchForm');
  const statusEl = document.getElementById('status');
  const table = document.getElementById('resultsTable');
  const tbody = document.getElementById('resultsBody');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const jd = document.getElementById('jobDescription').value;
    const files = document.getElementById('resumeFiles').files;
    if (!jd.trim() || files.length === 0) {
      statusEl.textContent = 'Job description and at least one file are required.';
      return;
    }

    const fd = new FormData();
    fd.append('job_description', jd);
    for (const f of files) fd.append('files', f);

    const btn = form.querySelector('button');
    btn.disabled = true;
    table.hidden = true;
    tbody.innerHTML = '';
    statusEl.textContent = `Scoring ${files.length} resume(s) in parallel...`;

    try {
      const resp = await fetch('/score/batch', { method: 'POST', body: fd });
      const data = await resp.json();
      if (!resp.ok) {
        statusEl.textContent = `Error: ${data.detail || resp.statusText}`;
        return;
      }
      renderResults(data);
      statusEl.textContent =
        `Done in ${data.timing.total_wall_seconds}s ` +
        `(extraction ${data.timing.extraction_seconds}s, semantic batch ${data.timing.semantic_batch_seconds}s) — ` +
        `${data.timing.succeeded_count} scored, ${data.timing.failed_count} failed.`;
    } catch (err) {
      statusEl.textContent = `Request failed: ${err}`;
    } finally {
      btn.disabled = false;
    }
  });

  function scoreClass(score) {
    if (score >= 75) return 'score-good';
    if (score >= 50) return 'score-mid';
    return 'score-bad';
  }

  function renderResults(data) {
    for (const c of data.candidates) {
      const row = document.createElement('tr');
      if (c.error) {
        row.className = 'candidate-error';
        row.innerHTML =
          `<td>&mdash;</td><td>${esc(c.filename)}</td>` +
          `<td colspan="4">Error: ${esc(c.error.message)}</td><td></td>`;
      } else {
        row.innerHTML =
          `<td>${c.rank}</td><td>${esc(c.filename)}</td>` +
          `<td class="score ${scoreClass(c.score.final_score)}">${c.score.final_score.toFixed(1)}</td>` +
          `<td>${c.score.keyword_match.score.toFixed(1)}</td>` +
          `<td>${c.score.semantic_similarity.score.toFixed(1)}</td>` +
          `<td>${c.score.formatting.score.toFixed(1)}</td>` +
          `<td><button type="button" class="link-btn" data-expand>Details</button></td>`;
        row.querySelector('[data-expand]').addEventListener('click', () => toggleDetails(row, c));
      }
      tbody.appendChild(row);
    }
    table.hidden = false;
  }

  function toggleDetails(row, c) {
    const next = row.nextElementSibling;
    if (next && next.classList.contains('details-row')) {
      next.remove();
      return;
    }
    const detail = document.createElement('tr');
    detail.className = 'details-row';
    const warnings = (c.meta.warnings || []).map(w => w.message).join('; ') || 'none';
    detail.innerHTML = `<td colspan="7">
      <div><strong>Matched required:</strong> ${listOrDash(c.score.keyword_match.matched_required)}</div>
      <div><strong>Missing required:</strong> ${listOrDash(c.score.keyword_match.missing_required)}</div>
      <div><strong>Matched preferred:</strong> ${listOrDash(c.score.keyword_match.matched_preferred)}</div>
      <div><strong>Missing preferred:</strong> ${listOrDash(c.score.keyword_match.missing_preferred)}</div>
      <div><strong>Formatting deductions:</strong> ${listOrDash(c.score.formatting.deductions)}</div>
      <div><strong>Extraction warnings:</strong> ${esc(warnings)}</div>
    </td>`;
    row.after(detail);
  }

  function listOrDash(arr) {
    return arr && arr.length ? arr.map(esc).join(', ') : '&mdash;';
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
  }
</script>
</body>
</html>
